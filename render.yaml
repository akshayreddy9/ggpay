# Render Blueprint: deploys the GGPay server + admin panel as a free web service.
services:
  - type: web
    name: ggpay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Paste the MongoDB Atlas connection string when Render asks for it.
      - key: MONGODB_URI
        sync: false
